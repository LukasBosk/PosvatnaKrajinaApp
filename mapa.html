<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - depoty, sídliště, pohřebiště</title>
    <meta name="theme-color" content="#4285f4"/>
    <style>
        /* ...původní CSS zůstává beze změny... */
    </style>
</head>
<body>
    <div class="header">
        <img src="./logo.png" alt="Logo Muzea regionu Boskovicka">
        <h1>Mapa - depoty, sídliště, pohřebiště</h1>
    </div>
    <h2 class="map-heading" id="mapHeading">Depoty</h2>
    <div class="main-content-area">
        <div class="map-container" id="mapContainer">
            <div class="map-wrapper" id="mapWrapper">
                <img src="./prazdna.jpg" alt="Základní mapa" class="map-base" id="baseMapImage">
                <img src="./depoty-body.png" alt="Body depoty" class="map-overlay active" data-target="depoty">
                <img src="./sidliste-body.png" alt="Body sídliště" class="map-overlay" data-target="sidliste">
                <img src="./pohrebiste-body.png" alt="Body pohrebiste" class="map-overlay" data-target="pohrebiste">
                <img src="./hradiste-body.png" alt="Body hradiště" class="map-overlay" data-target="hradiste">
            </div>
        </div>
        <div class="controls-column">
            <div class="button-controls">
                <button class="map-button active" data-target="depoty">Depoty</button>
                <button class="map-button" data-target="sidliste">Sídliště</button>
                <button class="map-button" data-target="pohrebiste">Pohřebiště</button>
                <button class="map-button" data-target="hradiste">Hradiště</button>
                <button class="map-button" data-target="all" id="allBtn">Vše</button>
                <button class="map-button" id="toggleBaseMapBtn" style="background-color:#faad14;color:#333;">Změnit podklad</button>
            </div>
            <div class="zoom-controls">
                <button class="zoom-button" id="zoomInBtn">+</button>
                <button class="zoom-button" id="zoomOutBtn">-</button>
                <button class="reset-button" id="resetZoomBtn">Reset</button>
            </div>
        </div>
    </div>
    <a href="./index.html" class="back-button">Zpět</a>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.map-button');
            const overlays = document.querySelectorAll('.map-overlay');
            const mapHeading = document.getElementById('mapHeading');
            const allBtn = document.getElementById('allBtn');
            const mapContainer = document.getElementById('mapContainer');
            const mapWrapper = document.getElementById('mapWrapper');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetZoomBtn = document.getElementById('resetZoomBtn');
            const baseMapImage = document.getElementById('baseMapImage');
            const toggleBaseMapBtn = document.getElementById('toggleBaseMapBtn');

            const MAP_INTRINSIC_WIDTH = 1682; 
            const MAP_INTRINSIC_HEIGHT = 1144;
            let initialScale = 1;
            let currentScale = 1;
            let currentX = 0;
            let currentY = 0;
            let isDragging = false;
            let initialClientX, initialClientY;
            let initialMapX, initialMapY;
            const ZOOM_STEP = 0.2;
            const MAX_ZOOM_FACTOR = 4;
            const MIN_ZOOM_FACTOR = 1;
            const defaultTransition = mapWrapper.style.transition;

            // --- Přepínání podkladové mapy ---
            const BASE_MAPS = ['./prazdna.jpg', './prazdna2.jpg'];
            let currentBaseMapIdx = 0;
            toggleBaseMapBtn.addEventListener('click', () => {
                currentBaseMapIdx = (currentBaseMapIdx + 1) % BASE_MAPS.length;
                baseMapImage.src = BASE_MAPS[currentBaseMapIdx];
                // pro jistotu reset zoomu a posunu
                resetZoomBtn.click();
            });

            function applyTransform() {
                const totalScale = initialScale * currentScale;
                mapWrapper.style.transform = `scale(${totalScale}) translate(${currentX}px, ${currentY}px)`;
            }
            function clampPan() {
                const totalScale = initialScale * currentScale;
                const scaledMapWidth = MAP_INTRINSIC_WIDTH * totalScale;
                const scaledMapHeight = MAP_INTRINSIC_HEIGHT * totalScale;
                const containerWidth = mapContainer.offsetWidth;
                const containerHeight = mapContainer.offsetHeight;
                let minX = (containerWidth - scaledMapWidth) / totalScale;
                let maxX = 0;
                if (scaledMapWidth < containerWidth) {
                    minX = (containerWidth - scaledMapWidth) / (2 * totalScale);
                    maxX = (containerWidth - scaledMapWidth) / (2 * totalScale);
                }
                let minY = (containerHeight - scaledMapHeight) / totalScale;
                let maxY = 0;
                if (scaledMapHeight < containerHeight) {
                    minY = (containerHeight - scaledMapHeight) / (2 * totalScale);
                    maxY = (containerHeight - scaledMapHeight) / (2 * totalScale);
                }
                currentX = Math.max(Math.min(currentX, maxX), minX);
                currentY = Math.max(Math.min(currentY, maxY), minY);
            }
            function resizeMap() {
                const containerWidth = mapContainer.offsetWidth;
                const containerHeight = mapContainer.offsetHeight;
                const scaleX = containerWidth / MAP_INTRINSIC_WIDTH;
                const scaleY = containerHeight / MAP_INTRINSIC_HEIGHT;
                initialScale = Math.min(scaleX, scaleY);
                mapWrapper.style.width = `${MAP_INTRINSIC_WIDTH}px`;
                mapWrapper.style.height = `${MAP_INTRINSIC_HEIGHT}px`;
                overlays.forEach(img => {
                    img.style.width = '100%';
                    img.style.height = '100%';
                });
                baseMapImage.style.width = '100%';
                baseMapImage.style.height = '100%';
                currentScale = MIN_ZOOM_FACTOR;
                currentX = 0;
                currentY = 0;
                clampPan();
                applyTransform();
            }
            zoomInBtn.addEventListener('click', () => {
                const oldScale = currentScale;
                currentScale = Math.min(currentScale + ZOOM_STEP, MAX_ZOOM_FACTOR);
                const factor = currentScale / oldScale;
                currentX = currentX * factor - (mapContainer.offsetWidth / (initialScale * oldScale)) * (factor - 1) / 2;
                currentY = currentY * factor - (mapContainer.offsetHeight / (initialScale * oldScale)) * (factor - 1) / 2;
                clampPan();
                applyTransform();
            });
            zoomOutBtn.addEventListener('click', () => {
                const oldScale = currentScale;
                currentScale = Math.max(currentScale - ZOOM_STEP, MIN_ZOOM_FACTOR);
                const factor = currentScale / oldScale;
                currentX = currentX * factor - (mapContainer.offsetWidth / (initialScale * oldScale)) * (factor - 1) / 2;
                currentY = currentY * factor - (mapContainer.offsetHeight / (initialScale * oldScale)) * (factor - 1) / 2;
                clampPan();
                applyTransform();
                if (currentScale === MIN_ZOOM_FACTOR) {
                    resetZoomBtn.click();
                }
            });
            resetZoomBtn.addEventListener('click', () => {
                currentScale = MIN_ZOOM_FACTOR;
                currentX = 0;
                currentY = 0;
                clampPan();
                applyTransform();
            });
            mapContainer.addEventListener('mousedown', (e) => {
                if (currentScale > MIN_ZOOM_FACTOR) {
                    isDragging = true;
                    mapContainer.classList.add('panning');
                    mapWrapper.style.transition = 'none';
                    initialClientX = e.clientX;
                    initialClientY = e.clientY;
                    initialMapX = currentX;
                    initialMapY = currentY;
                }
            });
            mapContainer.addEventListener('mouseup', () => {
                isDragging = false;
                mapContainer.classList.remove('panning');
                mapWrapper.style.transition = defaultTransition;
            });
            mapContainer.addEventListener('mouseleave', () => {
                isDragging = false;
                mapContainer.classList.remove('panning');
                mapWrapper.style.transition = defaultTransition;
            });
            mapContainer.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                currentX = initialMapX + (e.clientX - initialClientX) / (initialScale * currentScale);
                currentY = initialMapY + (e.clientY - initialClientY) / (initialScale * currentScale);
                clampPan();
                applyTransform();
            });
            mapContainer.addEventListener('touchstart', (e) => {
                if (currentScale > MIN_ZOOM_FACTOR && e.touches.length === 1) {
                    isDragging = true;
                    mapContainer.classList.add('panning');
                    mapWrapper.style.transition = 'none';
                    initialClientX = e.touches[0].clientX;
                    initialClientY = e.touches[0].clientY;
                    initialMapX = currentX;
                    initialMapY = currentY;
                }
            }, { passive: false });
            mapContainer.addEventListener('touchend', () => {
                isDragging = false;
                mapContainer.classList.remove('panning');
                mapWrapper.style.transition = defaultTransition;
            });
            mapContainer.addEventListener('touchcancel', () => {
                isDragging = false;
                mapContainer.classList.remove('panning');
                mapWrapper.style.transition = defaultTransition;
            });
            mapContainer.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                e.preventDefault();
                currentX = initialMapX + (e.touches[0].clientX - initialClientX) / (initialScale * currentScale);
                currentY = initialMapY + (e.touches[0].clientY - initialClientY) / (initialScale * currentScale);
                clampPan();
                applyTransform();
            }, { passive: false });

            function setActiveOverlay(target) {
                overlays.forEach(overlay => {
                    overlay.classList.remove('active', 'all-active');
                });
                buttons.forEach(btn => {
                    btn.classList.remove('active', 'all-active');
                });

                baseMapImage.style.opacity = "1";

                if (target === 'all') {
                    overlays.forEach(overlay => {
                        overlay.classList.add('all-active');
                    });
                    document.querySelector('[data-target="all"]').classList.add('all-active');
                    mapHeading.textContent = 'Vše';
                } else {
                    const button = document.querySelector(`.map-button[data-target="${target}"]`);
                    if (button) button.classList.add('active');
                    const activeOverlay = document.querySelector(`.map-overlay[data-target="${target}"]`);
                    if (activeOverlay) activeOverlay.classList.add('active');
                    mapHeading.textContent = button ? button.textContent : '';
                }
                resetZoomBtn.click();
            }
            const initialActiveButton = document.querySelector('.map-button.active');
            if (initialActiveButton) {
                mapHeading.textContent = initialActiveButton.textContent;
            }
            buttons.forEach(button => {
                if (button.id !== "toggleBaseMapBtn") { // nepřepínat podklad při ovládání overlayů
                    button.addEventListener('click', () => {
                        setActiveOverlay(button.dataset.target);
                    });
                }
            });
            window.addEventListener('resize', resizeMap);
            baseMapImage.onload = resizeMap;
            if (baseMapImage.complete) {
                resizeMap();
            }
        });
    </script>
</body>
</html>
